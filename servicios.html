<!DOCTYPE html>
<html lang="es">
<head>

  <title>Servicios | Herlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .hero-servicios {
      background: url('img/servicios/servicios.jpg') center/cover no-repeat;
      height: 60vh;
      position: relative;
      color: white;
    }
    .hero-servicios::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
    }
    .hero-servicios h1 {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-uppercase" href="index.html">Herlex</a>
    </div>
  </nav>

  <section class="hero-servicios d-flex align-items-center justify-content-center text-center">
    <h1 class="display-5 fw-bold">Nuestros servicios legales</h1>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="row text-center">
        <div class="col-md-4">
          <h4>Derecho Laboral</h4>
          <p>Asesoría en conflictos laborales, despidos, indemnizaciones y más.</p>
        </div>
        <div class="col-md-4">
          <h4>Derecho Familiar</h4>
          <p>Divorcios, acuerdos, régimen de visitas, alimentos, filiación.</p>
        </div>
        <div class="col-md-4">
          <h4>Consultoría Legal Integral</h4>

</html>
